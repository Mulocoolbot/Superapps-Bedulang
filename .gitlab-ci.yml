image : docker:29

services:
  - docker:29-dind
  
stages:
  - build
  - release
  - deploy

variables:
  CONTAINER_TEST_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  CONTAINER_RELEASE_IMAGE: $CI_REGISTRY_IMAGE:latest

docker-build:
  stage: build
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --pull -t $CONTAINER_TEST_IMAGE .
    - docker push $CONTAINER_TEST_IMAGE

# test:
#   stage: test
#   script:
#     - echo 'test'
    # - docker pull $CONTAINER_TEST_IMAGE
    # - docker run $CONTAINER_TEST_IMAGE php vendor/bin/phpunit --coverage-text --colors=never 

release-image:
  stage: release
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull $CONTAINER_TEST_IMAGE
    - docker tag $CONTAINER_TEST_IMAGE $CONTAINER_RELEASE_IMAGE
    - docker push $CONTAINER_RELEASE_IMAGE
  only:
    - main

deploy-production:
  stage: deploy
  image: dtzar/helm-kubectl
  script:
    - echo "deploy"
    - echo ${KUBE_CONFIG} | base64 -d > admin.config
    - export KUBECONFIG=admin.config
    - sed -i "s,<PROJECT_NAME>,${CI_PROJECT_NAME},g" .kubernetes/service.yaml
    #- sed -i "s,<PORT>,${PORT},g" .kubernetes/service.yaml
    - sed -i "s,<PROJECT_NAME>,${CI_PROJECT_NAME},g" .kubernetes/deployment.yaml
    - sed -i "s,<VERSION>,${CI_COMMIT_SHORT_SHA},g" .kubernetes/deployment.yaml
    - sed -i "s,<IMAGE>,${CI_REGISTRY_IMAGE},g" .kubernetes/deployment.yaml
    - kubectl apply -f .kubernetes/deployment.yaml 
    - kubectl rollout status deployment $CI_PROJECT_NAME -n default
    - kubectl apply -f .kubernetes/service.yaml
  only:
    - main
